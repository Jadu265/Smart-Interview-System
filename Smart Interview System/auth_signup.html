<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Interview System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="theme.js"></script>
    <script src="ui-dialogs.js"></script>
    <link rel="stylesheet" href="style.css?v=20260413">
</head>
<body class="c188 auth-shell">
    <div class="c189">
        <!-- Logo -->
        <div class="c190">
            <div class="c191">
                <div class="c192">
                    <span class="c193 material-symbols-outlined">psychology</span>
                </div>
                <h1 class="c194">Smart Interview</h1>
            </div>
            <p class="c27">Create your account</p>
        </div>

        <!-- Sign Up Form Card -->
        <div class="c141">
            <form id="signupForm" class="c195">
                <!-- Full Name -->
                <div>
                    <label class="c196">Full Name</label>
                    <input type="text" id="nameInput"required
                           class="c143" placeholder="Mr. X">
                    <p id="nameError" class="c197 hidden">Name is required</p>
                </div>

                <!-- Email -->
                <div>
                    <label class="c196">Email Address</label>
                    <input type="email" id="emailInput"required
                           class="c143" placeholder="your@email.com">
                    <p id="emailError" class="c197 hidden">Please enter a valid email</p>
                </div>

                <!-- Password -->
                <div>
                    <label class="c196">Password</label>
                        <input type="password" id="passwordInput" required
                               class="c143" placeholder="Enter your password">
                    <p class="c281">At least 8 characters</p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="c196">Confirm Password</label>
                        <input type="password" id="confirmPasswordInput" required
                               class="c143" placeholder="Confirm your password">
                    <p id="passwordError" class="c197 hidden">Passwords don't match</p>
                </div>

                <!-- Terms -->
                <label class="c282">
                    <input type="checkbox" id="termsCheckbox"required class="c283">
                    <span class="c201">I agree to the <a href="#" class="c284">Terms of Service</a> and <a href="#" class="c284">Privacy Policy</a></span>
                </label>

                <!-- Submit Button -->
                <button type="submit" id="signupBtn" class="c203">
                    <span id="signupBtnText">Create Account</span>
                    <span id="signupLoader" class="hidden">
                        <svg class="c160" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="c161" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="c162" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>

                <!-- Error Message -->
                <div id="errorMessage" class="c204 hidden"></div>
                
                <!-- Success Message -->
                <div id="successMessage" class="c205 hidden"></div>
            </form>

            <!-- Divider -->
            <div class="c206">
                <div class="c207">
                    <div class="c208"></div>
                </div>
                <div class="c209">
                    <span class="c210">OR</span>
                </div>
            </div>

            <!-- Google Sign Up -->
            <button id="googleBtn" type="button" class="c211">
                <svg class="c212" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Sign up with Google</span>
            </button>

            <!-- Login Link -->
            <p class="c213">
                Already have an account? 
                <a href="auth_login.html" class="c214">Login</a>
            </p>
        </div>
    </div>

    <!-- Firebase Config -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "YOUR_NEW_API_KEY_HERE",
            authDomain: "smartinterview-d2ef2.firebaseapp.com",
            databaseURL: "https://smartinterview-d2ef2-default-rtdb.firebaseio.com",
            projectId: "smartinterview-d2ef2",
            storageBucket: "smartinterview-d2ef2.firebasestorage.app",
            messagingSenderId: "889760323914",
            appId: "1:889760323914:web:83b0166175be22c32049b3",
            measurementId: "G-HMGZH00Y5W"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('Firebase initialized');

        // Check if already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('User already logged in, redirecting...');
                window.location.href = 'auth_dashboard.html';
            }
        });

        // Get form elements
        const signupForm = document.getElementById('signupForm');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const confirmPasswordInput = document.getElementById('confirmPasswordInput');
        const termsCheckbox = document.getElementById('termsCheckbox');
        const signupBtn = document.getElementById('signupBtn');
        const signupBtnText = document.getElementById('signupBtnText');
        const signupLoader = document.getElementById('signupLoader');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const googleBtn = document.getElementById('googleBtn');

        // Helper functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function setLoading(isLoading) {
            signupBtn.disabled = isLoading;
            if (isLoading) {
                signupBtnText.classList.add('hidden');
                signupLoader.classList.remove('hidden');
            } else {
                signupBtnText.classList.remove('hidden');
                signupLoader.classList.add('hidden');
            }
        }

        function splitFullName(name) {
            const cleanName = (name || '').trim().replace(/\s+/g, ' ');
            if (!cleanName) {
                return { firstName: '', lastName: '', fullName: '' };
            }

            const nameParts = cleanName.split(' ');
            const firstName = nameParts[0] || '';
            const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
            return { firstName, lastName, fullName: cleanName };
        }

        // Email/Password Sign Up
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const { firstName, lastName, fullName } = splitFullName(name);

            // Validation
            if (!name || !email || !password || !confirmPassword) {
                showError('Please fill in all fields');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showError('Please enter a valid email address');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            if (!termsCheckbox.checked) {
                showError('Please accept the terms and conditions');
                return;
            }

            setLoading(true);
            console.log('Creating account for:', email);

            try {
                // Create user account
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                console.log('Account created:', user.email);

                // Update profile with display name
                await user.updateProfile({
                    displayName: fullName
                });

                // Create user document in Firestore
                await db.collection('users').doc(user.uid).set({
                    uid: user.uid,
                    email: user.email,
                    displayName: fullName,
                    fullName,
                    firstName,
                    lastName,
                    role: 'candidate',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                    stats: {
                        totalInterviews: 0,
                        completedInterviews: 0,
                        averageScore: 0
                    }
                });

                console.log('User document created');
                showSuccess('Account created successfully! Redirecting to login...');
                
                // Redirect to login page
                setTimeout(() => {
                    window.location.href = 'auth_login.html';
                }, 1500);
                
            } catch (error) {
                console.error('Sign up error:', error);
                setLoading(false);
                
                // Better error messages
                if (error.code === 'permission-denied' || error.message.includes('permission')) {
                    showError('Firebase permission error! Check FIREBASE_PERMISSION_FIX.md file for solution.');
                } else {
                    // Handle specific errors
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            showError('This email is already registered');
                            break;
                        case 'auth/invalid-email':
                            showError('Invalid email address');
                            break;
                        case 'auth/weak-password':
                            showError('Password is too weak');
                            break;
                        case 'auth/operation-not-allowed':
                            showError('Email/password accounts are not enabled');
                            break;
                        default:
                            showError('Sign up failed: ' + error.message);
                    }
                }
            }
        });

        // Google Sign Up
        googleBtn.addEventListener('click', async () => {
            console.log('Attempting Google sign up...');
            
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const fallbackName = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
                const { firstName, lastName, fullName } = splitFullName(fallbackName);
                
                console.log('Google sign up successful:', user.email);
                
                // Check if user document exists
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    console.log('Creating user document...');
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: fullName,
                        fullName,
                        firstName,
                        lastName,
                        photoURL: user.photoURL,
                        role: 'candidate',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        stats: {
                            totalInterviews: 0,
                            completedInterviews: 0,
                            averageScore: 0
                        }
                    });
                }
                
                showSuccess('Account created successfully! Redirecting to login...');
                setTimeout(() => {
                    window.location.href = 'auth_login.html';
                }, 1500);
                
            } catch (error) {
                console.error('Google sign up error:', error);
                showError('Google sign up failed: ' + error.message);
            }
        });

        console.log('Sign up page ready');
    </script>
</body>
</html>
