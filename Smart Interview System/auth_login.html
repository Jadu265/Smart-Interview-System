<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login - Smart Interview System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="theme.js"></script>
    <script src="ui-dialogs.js"></script>
    <link rel="stylesheet" href="style.css?v=20260413">
</head>
<body class="c188 auth-shell">
    <div class="c189">
        <!-- Logo -->
        <div class="c190">
            <div class="c191">
                <div class="c192">
                    <span class="c193 material-symbols-outlined">psychology</span>
                </div>
                <h1 class="c194">Smart Interview System</h1>
            </div>
            <p class="c27">Login to your account</p>
        </div>

        <!-- Login Form Card -->
        <div class="c141">
            <form id="loginForm" class="c195 form-card">
                <!-- Email -->
                <div>
                    <label class="c196">Email Address</label>
                    <input type="email" id="emailInput"required
                           class="c143" placeholder="your@email.com">
                    <p id="emailError" class="c197 hidden">Please enter a valid email</p>
                </div>

                <!-- Password -->
                <div>
                    <label class="c196">Password</label>
                      <input type="password" id="passwordInput" required
                          class="c143" placeholder="Enter your password">
                    <p id="passwordError" class="c197 hidden">Password is required</p>
                </div>

                <!-- Remember Me -->
                <div class="c198">
                    <label class="c199">
                        <input type="checkbox" id="rememberMe" class="c200">
                        <span class="c201">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink" class="c202">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn" class="c203">
                    <span id="loginBtnText">Login</span>
                    <span id="loginLoader" class="hidden">
                        <svg class="c160" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="c161" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="c162" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </span>
                </button>

                <!-- Error Message -->
                <div id="errorMessage" class="c204 hidden"></div>
                
                <!-- Success Message -->
                <div id="successMessage" class="c205 hidden"></div>
            </form>

            <!-- Divider -->
            <div id="googleDivider" class="c206">
                <div class="c207">
                    <div class="c208"></div>
                </div>
                <div class="c209">
                    <span class="c210">OR</span>
                </div>
            </div>

            <!-- Google Sign In -->
            <button id="googleBtn" type="button" class="c211">
                <svg class="c212" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Sign in with Google</span>
            </button>

            <!-- Sign Up Link -->
            <p id="signupLink" class="c213">
                Don't have an account? 
                <a href="auth_signup.html" class="c214">Sign Up</a>
            </p>
        </div>
    </div>

    <!-- Firebase Config -->
    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "YOUR_NEW_API_KEY_HERE",
            authDomain: "smartinterview-d2ef2.firebaseapp.com",
            databaseURL: "https://smartinterview-d2ef2-default-rtdb.firebaseio.com",
            projectId: "smartinterview-d2ef2",
            storageBucket: "smartinterview-d2ef2.firebasestorage.app",
            messagingSenderId: "889760323914",
            appId: "1:889760323914:web:83b0166175be22c32049b3",
            measurementId: "G-HMGZH00Y5W"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        console.log('Firebase initialized');

        // Check if already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('User already logged in, redirecting...');
                window.location.href = 'auth_dashboard.html';
            }
        });

        // Check for admin login parameter
        const urlParams = new URLSearchParams(window.location.search);
        const isAdminLogin = urlParams.get('admin') === 'true';
        
        if (isAdminLogin) {
            console.log('Admin login mode detected');
            // Configure admin login mode
            document.addEventListener('DOMContentLoaded', () => {
                const emailInput = document.getElementById('emailInput');
                const emailLabel = document.querySelector('label[for="emailInput"]');
                
                // Change email field to username field
                emailInput.placeholder = 'Enter admin username';
                emailInput.type = 'text'; // Change from email to text for username
                
                // Update label
                if (!emailLabel) {
                    const labels = document.querySelectorAll('label');
                    labels[0].textContent = 'Admin Username';
                } else {
                    emailLabel.textContent = 'Admin Username';
                }
                
                // Hide Google Sign In, Sign Up link, and Forgot Password for admin mode
                const googleDivider = document.getElementById('googleDivider');
                const googleBtn = document.getElementById('googleBtn');
                const signupLink = document.getElementById('signupLink');
                const forgotPasswordLink = document.getElementById('forgotPasswordLink');
                
                if (googleDivider) googleDivider.style.display = 'none';
                if (googleBtn) googleBtn.style.display = 'none';
                if (signupLink) signupLink.style.display = 'none';
                if (forgotPasswordLink) forgotPasswordLink.style.display = 'none';
                
                // Add admin badge to form
                const formCard = document.querySelector('.form-card');
                if (formCard && !document.getElementById('adminBadge')) {
                    const adminBadge = document.createElement('div');
                    adminBadge.id = 'adminBadge';
                    adminBadge.className = 'admin-badge';
                    adminBadge.innerHTML = `
                        <span class="c215 material-symbols-outlined">admin_panel_settings</span>
                        <div>
                            <p class="c216">Admin Login Mode</p>
                            <p class="c217">Enter your admin credentials</p>
                        </div>
                    `;
                    formCard.insertBefore(adminBadge, formCard.firstChild);
                }
            });
        }

        // Get form elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const loginLoader = document.getElementById('loginLoader');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const googleBtn = document.getElementById('googleBtn');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');

        // Helper functions
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('hidden');
            successMessage.classList.add('hidden');
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        function setLoading(isLoading) {
            loginBtn.disabled = isLoading;
            if (isLoading) {
                loginBtnText.classList.add('hidden');
                loginLoader.classList.remove('hidden');
            } else {
                loginBtnText.classList.remove('hidden');
                loginLoader.classList.add('hidden');
            }
        }

        function splitFullName(name) {
            const cleanName = (name || '').trim().replace(/\s+/g, ' ');
            if (!cleanName) {
                return { firstName: '', lastName: '', fullName: '' };
            }

            const nameParts = cleanName.split(' ');
            const firstName = nameParts[0] || '';
            const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : '';
            return { firstName, lastName, fullName: cleanName };
        }

        // Email/Password Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const rawEmail = emailInput.value.trim();
            const email = rawEmail.toLowerCase();
            const password = passwordInput.value;

            // Validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            // Check for admin credentials first (before email validation)
            if (email === 'sisadmin' && password === '123') {
                setLoading(true);
                console.log('Admin login detected');
                showSuccess('Admin login successful! Redirecting...');
                localStorage.setItem('userType', 'admin');
                localStorage.setItem('userName', 'System Administrator');
                localStorage.setItem('userEmail', 'sisadmin');
                setTimeout(() => {
                    window.location.href = 'admin_dashboard.html';
                }, 1000);
                return;
            }

            // Email validation (only for regular users)
            if (!email.includes('@') || !email.includes('.')) {
                showError('Please enter a valid email address');
                return;
            }

            setLoading(true);
            
            console.log('Attempting login for:', email);

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                console.log('Login successful:', user.email);
                showSuccess('Login successful! Redirecting...');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'auth_dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                setLoading(false);
                
                // Handle specific errors
                switch (error.code) {
                    case 'auth/invalid-email':
                        showError('Invalid email address');
                        break;
                    case 'auth/user-disabled':
                        showError('This account has been disabled');
                        break;
                    case 'auth/user-not-found':
                        showError('No account found with this email');
                        break;
                    case 'auth/wrong-password':
                        showError('Incorrect password');
                        break;
                    case 'auth/invalid-credential':
                    case 'auth/invalid-login-credentials':
                        showError('Invalid email or password');
                        break;
                    case 'auth/too-many-requests':
                        showError('Too many failed attempts. Please try again later');
                        break;
                    default:
                        showError('Unable to sign in right now. Please try again.');
                }
            }
        });

        // Forgot Password
        forgotPasswordLink.addEventListener('click', async (e) => {
            e.preventDefault();

            if (isAdminLogin) {
                showError('Forgot password is not available in admin login mode');
                return;
            }

            const rawEmail = emailInput.value.trim();
            const email = rawEmail.toLowerCase();

            if (!rawEmail) {
                showError('Enter your email first, then click Forgot password');
                emailInput.focus();
                return;
            }

            if (!rawEmail.includes('@') || !rawEmail.includes('.')) {
                showError('Please enter a valid email address first');
                emailInput.focus();
                return;
            }

            const originalText = forgotPasswordLink.textContent;
            forgotPasswordLink.textContent = 'Sending...';
            forgotPasswordLink.classList.add('pointer-events-none', 'opacity-70');

            try {
                // Allow reset only for emails that exist in this app's user records.
                const byLowercase = await db.collection('users').where('email', '==', email).limit(1).get();
                const byOriginal = rawEmail === email
                    ? byLowercase
                    : await db.collection('users').where('email', '==', rawEmail).limit(1).get();

                if (byLowercase.empty && byOriginal.empty) {
                    showError('No account found with this email');
                    return;
                }

                await auth.sendPasswordResetEmail(rawEmail);
                showSuccess('Password reset email sent. Please check your inbox.');
            } catch (error) {
                console.error('Forgot password error:', error);

                switch (error.code) {
                    case 'auth/invalid-email':
                        showError('Invalid email address');
                        break;
                    case 'auth/too-many-requests':
                        showError('Too many requests. Please try again later');
                        break;
                    case 'auth/network-request-failed':
                        showError('Network error. Check your internet connection');
                        break;
                    default:
                        showError('Unable to process password reset right now. Please try again.');
                }
            } finally {
                forgotPasswordLink.textContent = originalText;
                forgotPasswordLink.classList.remove('pointer-events-none', 'opacity-70');
            }
        });

        // Google Sign In
        googleBtn.addEventListener('click', async () => {
            console.log('Attempting Google sign in...');
            
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const fallbackName = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
                const { firstName, lastName, fullName } = splitFullName(fallbackName);
                
                console.log('Google sign in successful:', user.email);
                
                // Check if user document exists, create if not
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (!userDoc.exists) {
                    console.log('Creating user document...');
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: fullName,
                        fullName,
                        firstName,
                        lastName,
                        photoURL: user.photoURL,
                        role: 'candidate',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    // Update last login
                    await db.collection('users').doc(user.uid).update({
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'auth_dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Google sign in error:', error);
                showError('Google sign in failed: ' + error.message);
            }
        });

        console.log('Login page ready');
    </script>
</body>
</html>
